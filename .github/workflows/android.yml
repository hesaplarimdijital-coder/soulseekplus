# Derler (:core JVM testleri + imzalı sürüm APK'sı), günlüğü ci/logs dalına,
# APK'yı ci/apk dalına ve "nightly" sürümüne (Release) koyar.
name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Depo sırrı yoksa sürüm APK'sı hata ayıklama anahtarıyla imzalanır; anahtar önbellekte tutulur
      # ki ardışık derlemeler aynı imzayı taşısın ve güncelleme olarak kurulabilsin.
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: soulseekplus-debug-keystore-v1

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$RUNNER_TEMP/signing"
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build and test
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :core:test :app:assembleRelease --continue --stacktrace --console=plain 2>&1 | tee build.log

      - name: Publish log to ci/logs
        if: always() && github.event_name != 'pull_request'
        env:
          TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          out="$RUNNER_TEMP/logs"
          rm -rf "$out" && mkdir -p "$out"
          cp build.log "$out/" 2>/dev/null || echo "no log" > "$out/build.log"
          grep -E "^e: |error:|FAILED|BUILD (SUCCESSFUL|FAILED)|warning:.*(unchecked|deprecat)" build.log | head -400 > "$out/errors.txt" || true
          [ -d core/build/test-results ] && cp -r core/build/test-results "$out/core-test-results" || true
          echo "sha=${GITHUB_SHA} run=${GITHUB_RUN_NUMBER} status=${STATUS}" > "$out/STATUS"
          cd "$out"
          git init -q && git checkout -q --orphan ci/logs
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Build log for ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci/logs

      - name: Publish APK
        if: success() && github.event_name != 'pull_request'
        env:
          TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          name="SoulseekPlus-1.0.${GITHUB_RUN_NUMBER}.apk"
          out="$RUNNER_TEMP/apk"
          rm -rf "$out" && mkdir -p "$out"
          cp "$apk" "$out/$name"
          (cd "$out" && sha256sum "$name" > SHA256SUMS && echo "sha=${GITHUB_SHA} run=${GITHUB_RUN_NUMBER}" > STATUS \
            && git init -q && git checkout -q --orphan ci/apk \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "APK ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})" \
            && git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci/apk)
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly "$out/$name" --target "$GITHUB_SHA" --prerelease \
            --title "Soulseek+ 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Otomatik derleme: ${GITHUB_SHA::7} (çalıştırma ${GITHUB_RUN_NUMBER})."

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: soulseekplus-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # Emülatörde duman testi: APK kurulur, açılır, ekranlar gezilir, çökme aranır.
  # Ekran görüntüleri ve rapor ci/smoke dalına konur.
  smoke:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: soulseekplus-apk
          path: apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Demo ağı: sahte sunucu (2242) + paylaşım yapan demo eşler. Emülatör 10.0.2.2:2242'ye bağlanır.
      - name: Start demo Soulseek network
        run: |
          chmod +x gradlew
          ./gradlew :core:writeDemoClasspath --console=plain
          ./gradlew --stop
          DEMO_DEBUG=1 nohup java -Xmx384m -cp "$(cat core/build/demo-classpath.txt)" com.soulseekplus.core.engine.DemoNetworkKt > demo-network.log 2>&1 &
          for i in $(seq 1 90); do
            if grep -q "DEMO: server listening" demo-network.log; then echo "demo network up"; exit 0; fi
            sleep 2
          done
          cat demo-network.log; exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci-smoke.sh "$(ls apk/*.apk | head -1)"

      - name: Publish smoke results to ci/smoke
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/smoke"
          rm -rf "$out" && mkdir -p "$out"
          cp -r smoke-out/. "$out/" 2>/dev/null || true
          cp smoke.log "$out/" 2>/dev/null || echo "no smoke log" > "$out/smoke.log"
          cp demo-network.log "$out/" 2>/dev/null || true
          status=success
          grep -q SMOKE_FAILED "$out/smoke.log" && status=failure
          [ -f "$out/report.txt" ] || status=failure
          echo "sha=${GITHUB_SHA} run=${GITHUB_RUN_NUMBER} status=${status}" > "$out/STATUS"
          cd "$out"
          git init -q && git checkout -q --orphan ci/smoke
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Smoke ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci/smoke
          [ "$status" = success ]
